<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時文字雲 — ANESTHESIA SIMULATION</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部工具列 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .header-left h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .badge.live::before {
      content: '● ';
      color: #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .count-badge {
      font-size: 0.8rem;
      color: #64748b;
    }

    button {
      padding: 0.4rem 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #334155; color: #e2e8f0; }

    button.danger {
      border-color: #7f1d1d;
      color: #f87171;
    }
    button.danger:hover { background: #450a0a; }

    /* 文字雲畫布區 */
    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #wordcloud-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 空白提示 */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #334155;
      pointer-events: none;
    }

    #empty-state .big-icon { font-size: 4rem; opacity: 0.4; }
    #empty-state p { font-size: 1rem; }

    /* QR code 提示（右下角） */
    .hint {
      position: absolute;
      bottom: 1rem;
      right: 1.25rem;
      font-size: 0.75rem;
      color: #334155;
      text-align: right;
    }

    .hint a { color: #475569; text-decoration: none; }
    .hint a:hover { color: #6366f1; }

    /* 確認對話框 */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.show { display: flex; }

    .confirm-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    .confirm-box h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
    .confirm-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .confirm-box .btn-row { display: flex; gap: 0.75rem; justify-content: center; }
    .confirm-box .btn-row button { flex: 1; padding: 0.6rem; }
    .confirm-box .btn-confirm { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; }
    .confirm-box .btn-confirm:hover { background: #991b1b; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>☁️ 即時文字雲</h1>
      <span class="badge live" id="statusBadge">連線中…</span>
    </div>
    <div class="header-right">
      <span class="count-badge" id="countBadge">0 筆</span>
      <a href="index.html"><button>＋ 輸入頁</button></a>
      <button class="danger" id="clearBtn">🔄 開新活動</button>
    </div>
  </header>

  <div id="canvas-wrapper">
    <canvas id="wordcloud-canvas"></canvas>
    <div id="empty-state">
      <div class="big-icon">☁️</div>
      <p>等待學生輸入關鍵字…</p>
    </div>
    <div class="hint">
      輸入頁：<a href="index.html" target="_blank">index.html</a>
    </div>
  </div>

  <!-- 開新活動確認對話框 -->
  <div id="confirm-overlay">
    <div class="confirm-box">
      <h3>開始新活動？</h3>
      <p>將清除所有關鍵字，並讓學生可以重新送出。</p>
      <div class="btn-row">
        <button id="cancelBtn">取消</button>
        <button class="btn-confirm" id="confirmClearBtn">確定開始</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getFirestore, collection, onSnapshot,
      getDocs, deleteDoc, doc, setDoc
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA7-V2Nr2caPLSkWaJ1njY54IcWn1Wc6-s",
      authDomain: "anesthesia-simulation.firebaseapp.com",
      projectId: "anesthesia-simulation",
      storageBucket: "anesthesia-simulation.firebasestorage.app",
      messagingSenderId: "1045190313519",
      appId: "1:1045190313519:web:12abce4773d2238c6428da"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const col = collection(db, 'wordcloud_words');

    const canvas     = document.getElementById('wordcloud-canvas');
    const wrapper    = document.getElementById('canvas-wrapper');
    const emptyState = document.getElementById('empty-state');
    const countBadge = document.getElementById('countBadge');
    const statusBadge = document.getElementById('statusBadge');
    const clearBtn   = document.getElementById('clearBtn');
    const overlay    = document.getElementById('confirm-overlay');
    const cancelBtn  = document.getElementById('cancelBtn');
    const confirmClearBtn = document.getElementById('confirmClearBtn');

    // 調整 canvas 尺寸
    function resizeCanvas() {
      canvas.width  = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (lastWordList.length) renderCloud(lastWordList);
    });

    // 顏色池（專業感）
    const COLORS = [
      '#818cf8', '#a78bfa', '#34d399', '#60a5fa',
      '#f472b6', '#fb923c', '#facc15', '#2dd4bf',
    ];

    let lastWordList = [];

    function renderCloud(wordList) {
      if (!wordList.length) {
        emptyState.style.display = 'flex';
        return;
      }
      emptyState.style.display = 'none';

      // 計算頻率
      const freq = {};
      wordList.forEach(w => {
        const key = w.toLowerCase();
        freq[key] = (freq[key] || 0) + 1;
      });

      const entries = Object.entries(freq)
        .sort((a, b) => b[1] - a[1]);

      // 基底字型大小（依畫布面積調整）
      const area  = canvas.width * canvas.height;
      const base  = Math.max(20, Math.min(80, Math.sqrt(area) / 10));
      const maxFreq = entries[0][1];

      const list = entries.map(([word, count]) => [
        word,
        Math.round(base * 0.6 + (count / maxFreq) * base * 1.8)
      ]);

      WordCloud(canvas, {
        list,
        gridSize       : Math.round(canvas.width / 80),
        weightFactor   : 1,
        fontFamily     : "'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif",
        color          : () => COLORS[Math.floor(Math.random() * COLORS.length)],
        rotateRatio    : 0.3,
        rotationSteps  : 2,
        backgroundColor: 'transparent',
        drawOutOfBound : false,
        shrinkToFit    : true,
        clearCanvas    : true,
      });
    }

    // 即時監聽 Firestore
    onSnapshot(col, (snapshot) => {
      statusBadge.textContent = '即時更新';
      statusBadge.className = 'badge live';

      const words = [];
      snapshot.forEach(d => {
        const w = d.data().word;
        if (w) words.push(w.trim());
      });

      lastWordList = words;
      countBadge.textContent = `${words.length} 筆`;
      renderCloud(words);
    }, (err) => {
      statusBadge.textContent = '連線失敗';
      statusBadge.className = 'badge';
      console.error(err);
    });

    // 清除功能
    clearBtn.addEventListener('click', () => {
      overlay.classList.add('show');
    });
    cancelBtn.addEventListener('click', () => {
      overlay.classList.remove('show');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });

    confirmClearBtn.addEventListener('click', async () => {
      overlay.classList.remove('show');
      confirmClearBtn.disabled = true;
      confirmClearBtn.textContent = '處理中…';
      try {
        // 1. 清除所有關鍵字
        const snap = await getDocs(col);
        const deletes = snap.docs.map(d => deleteDoc(doc(db, 'wordcloud_words', d.id)));
        await Promise.all(deletes);

        // 2. 更新 session ID，讓學生可以重新送出
        await setDoc(doc(db, 'sessions', 'current'), {
          sessionId: Date.now().toString()
        });
      } catch (err) {
        alert('操作失敗：' + err.message);
      } finally {
        confirmClearBtn.disabled = false;
        confirmClearBtn.textContent = '確定開始';
      }
    });
  </script>
</body>
</html>
