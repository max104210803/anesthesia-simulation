<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字雲 — 輸入關鍵字</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      padding: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .icon { font-size: 3rem; margin-bottom: 0.75rem; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: 0.75rem;
      border: 2px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 0.75rem;
      text-align: center;
      letter-spacing: 0.03em;
    }

    input[type="text"]:focus { border-color: #6366f1; }
    input[type="text"]::placeholder { color: #475569; }

    .char-count {
      font-size: 0.78rem;
      color: #475569;
      text-align: right;
      margin-bottom: 1.2rem;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      border-radius: 0.75rem;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 1.2rem;
      min-height: 2rem;
      font-size: 0.95rem;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      transition: all 0.3s;
    }

    .message.success {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }

    .message.error {
      background: #2d0a0a;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    .divider {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 2rem 0 1.5rem;
    }

    .display-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s;
    }
    .display-link:hover { color: #6366f1; }

    .counter {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1>輸入你的關鍵字</h1>
    <p class="subtitle">輸入一個與今天課程相關的詞彙</p>

    <form id="wordForm">
      <input
        type="text"
        id="wordInput"
        placeholder="例如：propofol"
        maxlength="20"
        autocomplete="off"
        autofocus
      />
      <div class="char-count"><span id="charCount">0</span> / 20</div>
      <button type="submit" id="submitBtn">送出 →</button>
    </form>

    <div class="message" id="message"></div>
    <div class="counter" id="counter"></div>

    <hr class="divider" />
    <a href="display.html" class="display-link">
      ☁️ 查看即時文字雲
    </a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getFirestore, collection, addDoc, getCountFromServer, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA7-V2Nr2caPLSkWaJ1njY54IcWn1Wc6-s",
      authDomain: "anesthesia-simulation.firebaseapp.com",
      projectId: "anesthesia-simulation",
      storageBucket: "anesthesia-simulation.firebasestorage.app",
      messagingSenderId: "1045190313519",
      appId: "1:1045190313519:web:12abce4773d2238c6428da"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const col = collection(db, 'wordcloud_words');

    const form       = document.getElementById('wordForm');
    const input      = document.getElementById('wordInput');
    const submitBtn  = document.getElementById('submitBtn');
    const messageEl  = document.getElementById('message');
    const counterEl  = document.getElementById('counter');
    const charCount  = document.getElementById('charCount');

    // 即時字數
    input.addEventListener('input', () => {
      charCount.textContent = input.value.length;
    });

    // 取得目前總筆數
    async function refreshCount() {
      try {
        const snap = await getCountFromServer(col);
        counterEl.textContent = `目前已收到 ${snap.data().count} 筆關鍵字`;
      } catch (_) {}
    }
    refreshCount();

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      setTimeout(() => {
        messageEl.textContent = '';
        messageEl.className = 'message';
      }, 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const word = input.value.trim();
      if (!word) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '送出中…';

      try {
        await addDoc(col, {
          word: word,
          created_at: serverTimestamp()
        });
        showMessage(`✅ 「${word}」已送出！`, 'success');
        input.value = '';
        charCount.textContent = '0';
        refreshCount();
      } catch (err) {
        showMessage('❌ 送出失敗，請再試一次', 'error');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送出 →';
      }
    });
  </script>
</body>
</html>
